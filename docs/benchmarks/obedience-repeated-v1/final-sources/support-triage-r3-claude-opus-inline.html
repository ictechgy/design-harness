<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Support Triage Benchmark Fixture</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
        color: #1f2a24;
        background: #f2f7f3;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f2f7f3;
      }

      .shell {
        width: min(100% - 32px, 820px);
        margin-inline: auto;
        padding-block: 20px 44px;
      }

      .masthead {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 16px;
        border-bottom: 1px solid #b9c8bd;
      }

      nav a {
        color: #175f3f;
        font-weight: 700;
      }

      h1 {
        margin: 28px 0 8px;
        font-size: 2rem;
        line-height: 1.2;
      }

      h2 {
        margin: 0;
        font-size: 1.35rem;
        line-height: 1.3;
      }

      p {
        max-width: 62ch;
        line-height: 1.55;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 180px;
        gap: 24px;
        margin-top: 24px;
        padding: 24px;
        border: 1px solid #b9c8bd;
        border-radius: 10px;
        background: #ffffff;
      }

      .fields {
        display: grid;
        gap: 16px;
        margin-top: 20px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      label {
        font-weight: 700;
      }

      input,
      select,
      button {
        min-width: 44px;
        min-height: 44px;
        padding: 10px 12px;
        border: 1px solid #526259;
        border-radius: 6px;
        background: #ffffff;
        color: #1f2a24;
        font: inherit;
      }

      input:focus-visible,
      select:focus-visible,
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid #1b6d49;
        outline-offset: 3px;
      }

      button {
        justify-self: start;
        border-color: #175f3f;
        background: #175f3f;
        color: #ffffff;
        font-weight: 700;
        cursor: pointer;
      }

      .preview img {
        display: block;
        width: 160px;
        height: 96px;
        border-radius: 8px;
        background: #d8eadf;
      }

      [role="status"] {
        margin: 16px 0 0;
        padding: 12px;
        border-left: 4px solid #1b6d49;
        background: #edf8f1;
        font-weight: 700;
      }

      @media (max-width: 620px) {
        .workspace {
          grid-template-columns: 1fr;
        }

        .preview img {
          width: 100%;
          height: 120px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell" data-benchmark-feature="triage-shell">
      <header class="masthead" data-benchmark-feature="support-header">
        <strong data-benchmark-feature="product-name">Service desk</strong>
        <nav aria-label="Support navigation" data-benchmark-feature="support-navigation">
          <a href="#triage-workspace">Ticket triage</a>
        </nav>
      </header>

      <main data-benchmark-feature="triage-main">
        <h1 data-benchmark-feature="triage-heading">Support overview</h1>
        <p data-benchmark-feature="triage-intro">Review incoming support tickets, narrow the active queue, and assign the next escalation without leaving this workspace.</p>

        <section class="workspace" id="triage-workspace" aria-labelledby="workspace-heading" data-benchmark-feature="triage-workspace">
          <div data-benchmark-feature="triage-form-region">
            <h2 id="workspace-heading" data-benchmark-feature="workspace-heading">Incoming tickets</h2>
            <div class="fields">
              <div class="field">
                <label for="ticket-search" data-benchmark-feature="ticket-search-label">Search tickets</label>
                <input
                  id="ticket-search"
                  name="ticket-search"
                  type="search"
                  autocomplete="off"
                  data-benchmark-feature="ticket-search"
                >
              </div>
              <div class="field">
                <label for="priority-filter" data-benchmark-feature="priority-label">Priority</label>
                <select id="priority-filter" name="priority-filter" data-benchmark-feature="priority-filter">
                  <option>All priorities</option>
                  <option>Urgent</option>
                </select>
              </div>
              <button type="button" data-benchmark-feature="assign-action">Assign next ticket</button>
            </div>
            <p role="status" aria-live="polite" data-benchmark-feature="triage-status">Escalated tickets: 4</p>
          </div>

          <aside class="preview" aria-label="Triage activity preview" data-benchmark-feature="activity-preview">
            <img
              src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="
              alt="Support ticket activity preview"
              data-benchmark-feature="activity-image"
            >
            <p data-benchmark-feature="preview-copy">Queue activity is summarized here while the operator reviews the active ticket list.</p>
          </aside>
        </section>
      </main>
    </div>
  </body>
</html>
