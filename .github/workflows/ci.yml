name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check

  example-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @design-harness/visual-audit exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm smoke:example
      - run: pnpm smoke:copy
      - run: pnpm smoke:visual-metrics
      - run: pnpm smoke:density-lower-bound
      - run: pnpm smoke:loop
      - run: pnpm smoke:selector-uniqueness
      - run: pnpm smoke:spacing-skip
      - run: pnpm smoke:packed-loop
      - run: pnpm calibrate:fixtures
      - name: Upload Design Harness example artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: design-harness-example-smoke
          path: |
            runs/example-smoke
            runs/copy-smoke
            runs/visual-metrics
            runs/density-lower-bound
            runs/loop-smoke
            runs/packed-loop
            runs/calibration
          if-no-files-found: warn
          retention-days: 14
