<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spacing adherence error-boundary fixture</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        row-gap: 0;
        column-gap: 0;
      }
      html {
        font-size: 16px;
      }
      body {
        padding: 1rem;
        color: #14171C;
        background: #FAFAF7;
        font: 16px/1.5 "Inter", sans-serif;
      }
      main {
        padding: 0.5rem;
        background: #FFFFFF;
      }
      .slot-bundle {
        position: absolute;
        inset: 0 auto auto 0;
        width: 1px;
        height: 1px;
      }
    </style>
  </head>
  <body>
    <main id="fixture-root">
      <h1>Spacing evidence boundary</h1>
      <p>Unrelated viewport measurements remain available when spacing evidence fails.</p>
    </main>
    <script>
      const scenario = new URLSearchParams(window.location.search).get("scenario");
      const root = document.querySelector("#fixture-root");

      if (scenario === "candidate-limit" && root) {
        const fragment = document.createDocumentFragment();
        for (let index = 0; index < 2501; index += 1) {
          const element = document.createElement("div");
          element.className = "slot-bundle";
          element.setAttribute("aria-hidden", "true");
          fragment.append(element);
        }
        root.append(fragment);
      } else if (scenario === "root-font-size") {
        const getComputedStyle = window.getComputedStyle;
        window.getComputedStyle = function (element, pseudoElement) {
          const style = getComputedStyle.call(this, element, pseudoElement);
          if (element !== document.documentElement) {
            return style;
          }
          return new Proxy(style, {
            get(target, property) {
              if (property === "fontSize") {
                return "normal";
              }
              const value = Reflect.get(target, property, target);
              return typeof value === "function" ? value.bind(target) : value;
            }
          });
        };
      } else if (scenario === "selector-evaluation") {
        const closest = Element.prototype.closest;
        Element.prototype.closest = function (selector) {
          if (selector === ".third-party-spacing-widget") {
            throw new Error("fixture selector evaluation failure");
          }
          return closest.call(this, selector);
        };
      }
    </script>
  </body>
</html>
